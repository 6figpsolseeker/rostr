name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      # Builds the workspace packages to dist as a side effect of typecheck
      # above, then compiles the web app against them.
      - name: Build web app
        run: pnpm --filter @rostr/web build

  # The rules hash is what members sign when they join a league. If canonical
  # encoding drifts, previously created leagues become unverifiable — so the
  # golden fixture is checked on a second Node major as well.
  hash-stability:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # pnpm 11 requires Node >= 22.13.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rules hash golden fixture
        run: pnpm vitest run packages/core/src/rules/rules.test.ts
