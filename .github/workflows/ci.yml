name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The migration check below compares against the base branch, and
          # checkout does not fetch it: it is a single-refspec fetch rather than
          # a clone, so `origin/main` does not exist in the runner at all and
          # `git ls-tree origin/main` fails outright.
          fetch-depth: 0

      # Deliberately before install: it needs only git and node, so a numbering
      # mistake is reported in seconds rather than behind a full install and
      # build. Runs on every pull request rather than being filtered to
      # `packages/db/migrations/**` — a required check that never fires reads as
      # permanently pending and blocks the merge, so it exits early instead.
      - name: Migration numbering
        if: github.event_name == 'pull_request'
        run: node scripts/check-migration-numbers.mjs "origin/${{ github.base_ref }}"

      # Deliberately before install, like the migration check above: it reads
      # JSON and needs no toolchain, so a missing project is reported in seconds.
      # Every package must have both halves of its TypeScript project — the build
      # config that fills `dist/`, and the `noEmit` config that checks its test
      # files. For the repo's first year they had only the first, and 74 test
      # files across five packages were typechecked by nothing (#257). A sixth
      # package added by copying a fifth would inherit the hole silently, so it
      # is asserted rather than remembered.
      - name: Test projects are wired up
        run: node scripts/check-test-projects.mjs

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      # Deliberately NOT a web app build. That lived here and proved less than
      # it appeared to: `pnpm typecheck` above runs `tsc --build`, which fills
      # every package's `dist/`, so the build ran against packages that were
      # already compiled — a state no deploy is ever in. The `deploy-build` job
      # below is the honest version, on a clean checkout.

  # The build a deploy actually performs, on a tree that has never been built.
  #
  # This exists because the first production deploy failed with
  # `Module not found: Can't resolve '@rostr/escrow'` while CI was green. The web
  # app imports five workspace packages, each resolving to `./dist/index.js`;
  # `dist/` is gitignored, so a fresh clone has none of them, and the host runs
  # only the app's own build script. Every gate in `check` misses this, because
  # each one either compiles the packages first or runs where they are already
  # compiled.
  #
  # A separate job rather than a step, because the isolation is the whole point:
  # it needs a runner where nothing has run `tsc` yet. Adding it to `check`
  # would put it after the typecheck that hides the failure.
  #
  # It runs the app's `vercel-build` script — the same command the host runs —
  # so if that script is removed or broken, this fails here rather than on a
  # deploy nobody watches.
  deploy-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # No typecheck, no test, no build of any kind before this. If a step is
      # ever added above it, this job stops testing what it was written for.
      - name: Build as the host does, from a clean tree
        run: pnpm vercel-build
        working-directory: apps/web

  # The rules hash is what members sign when they join a league. If canonical
  # encoding drifts, previously created leagues become unverifiable — so the
  # golden fixture is checked on a second Node major as well.
  hash-stability:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # pnpm 11 requires Node >= 22.13.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rules hash golden fixture
        run: pnpm vitest run packages/core/src/rules/rules.test.ts
