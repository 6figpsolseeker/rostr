name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The migration check below compares against the base branch, and
          # checkout does not fetch it: it is a single-refspec fetch rather than
          # a clone, so `origin/main` does not exist in the runner at all and
          # `git ls-tree origin/main` fails outright.
          fetch-depth: 0

      # Deliberately before install: it needs only git and node, so a numbering
      # mistake is reported in seconds rather than behind a full install and
      # build. Runs on every pull request rather than being filtered to
      # `packages/db/migrations/**` — a required check that never fires reads as
      # permanently pending and blocks the merge, so it exits early instead.
      - name: Migration numbering
        if: github.event_name == 'pull_request'
        run: node scripts/check-migration-numbers.mjs "origin/${{ github.base_ref }}"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      # Builds the workspace packages to dist as a side effect of typecheck
      # above, then compiles the web app against them.
      - name: Build web app
        run: pnpm --filter @rostr/web build

  # The rules hash is what members sign when they join a league. If canonical
  # encoding drifts, previously created leagues become unverifiable — so the
  # golden fixture is checked on a second Node major as well.
  hash-stability:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # pnpm 11 requires Node >= 22.13.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rules hash golden fixture
        run: pnpm vitest run packages/core/src/rules/rules.test.ts
